<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title description">
  <title id="title">Jig architecture</title>
  <desc id="description">A dashboard or CLI asks an authoring agent to create a versioned TypeScript jig. Triggers and the active jig enter the runtime engine, which executes through the Jig SDK. The SDK makes model calls and step-scoped MCP tool calls explicit.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#7b828c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#43d39e"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6da8ff"/>
    </marker>
  </defs>

  <rect width="1600" height="780" rx="24" fill="#0b0d10"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="56" y="62" fill="#f5f7fa" font-size="34" font-weight="650" letter-spacing="-0.6">Jig architecture</text>
    <text x="56" y="96" fill="#9299a3" font-size="18">AI writes the workflow. The engine runs the code. The SDK makes every boundary explicit.</text>

    <text x="56" y="145" fill="#717883" font-size="13" font-weight="700" letter-spacing="2.2">AUTHORING</text>

    <g>
      <rect x="56" y="170" width="260" height="150" rx="16" fill="#111419" stroke="#292e36" stroke-width="2"/>
      <text x="82" y="214" fill="#f2f4f7" font-size="25" font-weight="600">Dashboard / CLI</text>
      <text x="82" y="249" fill="#9ca3ad" font-size="17">Describe and review</text>
      <text x="82" y="282" fill="#6f7781" font-size="15" font-family="'SFMono-Regular', Consolas, monospace">plain-English intent</text>
    </g>

    <g>
      <rect x="376" y="160" width="300" height="170" rx="18" fill="#101824" stroke="#6da8ff" stroke-opacity="0.72" stroke-width="2"/>
      <text x="404" y="203" fill="#87b8ff" font-size="13" font-weight="700" letter-spacing="1.8">AUTHORING AGENT</text>
      <text x="404" y="246" fill="#f2f4f7" font-size="27" font-weight="600">Prompt → code</text>
      <text x="404" y="281" fill="#aeb5bf" font-size="17">discover · generate · validate</text>
      <text x="404" y="309" fill="#7188a7" font-size="14" font-family="'SFMono-Regular', Consolas, monospace">TypeScript</text>
    </g>

    <g>
      <rect x="736" y="160" width="330" height="170" rx="18" fill="#111719" stroke="#43d39e" stroke-opacity="0.72" stroke-width="2"/>
      <text x="764" y="203" fill="#67dcb1" font-size="13" font-weight="700" letter-spacing="1.8">VERSIONED STORE</text>
      <text x="764" y="246" fill="#f2f4f7" font-size="27" font-weight="600">Approved jig</text>
      <text x="764" y="281" fill="#aeb5bf" font-size="17">active · pending · history</text>
      <text x="764" y="309" fill="#6f987f" font-size="14" font-family="'SFMono-Regular', Consolas, monospace">SQLite</text>
    </g>

    <g fill="none" stroke="#7b828c" stroke-width="2.5" marker-end="url(#arrow)">
      <path d="M316 245H366"/>
      <path d="M676 245H726"/>
    </g>
    <g fill="#7d858f" font-size="13" font-family="'SFMono-Regular', Consolas, monospace">
      <text x="323" y="231">prompt</text>
      <text x="683" y="231">writes</text>
    </g>

    <text x="56" y="414" fill="#717883" font-size="13" font-weight="700" letter-spacing="2.2">EXECUTION</text>

    <g>
      <rect x="56" y="454" width="210" height="200" rx="16" fill="#111419" stroke="#292e36" stroke-width="2"/>
      <text x="82" y="497" fill="#7f8791" font-size="13" font-weight="700" letter-spacing="1.8">TRIGGERS</text>
      <text x="82" y="543" fill="#f2f4f7" font-size="24" font-weight="600">Start a run</text>
      <text x="82" y="583" fill="#aeb5bf" font-size="17">manual</text>
      <text x="82" y="613" fill="#aeb5bf" font-size="17">cron · webhook</text>
    </g>

    <g>
      <rect x="326" y="444" width="270" height="220" rx="18" fill="#101a16" stroke="#43d39e" stroke-opacity="0.8" stroke-width="2"/>
      <text x="354" y="487" fill="#67dcb1" font-size="13" font-weight="700" letter-spacing="1.8">RUNTIME ENGINE</text>
      <text x="354" y="532" fill="#f2f4f7" font-size="27" font-weight="600">Run the jig</text>
      <text x="354" y="568" fill="#aeb5bf" font-size="17">load · validate</text>
      <text x="354" y="598" fill="#aeb5bf" font-size="17">execute · record</text>
      <text x="354" y="636" fill="#6f987f" font-size="14" font-family="'SFMono-Regular', Consolas, monospace">src/runner.ts</text>
    </g>

    <g>
      <rect x="656" y="429" width="330" height="250" rx="20" fill="#101824" stroke="#6da8ff" stroke-opacity="0.82" stroke-width="2"/>
      <text x="686" y="473" fill="#87b8ff" font-size="13" font-weight="700" letter-spacing="1.8">JIG SDK</text>
      <text x="686" y="516" fill="#f2f4f7" font-size="28" font-weight="600">@jig/sdk</text>
      <text x="686" y="548" fill="#aeb5bf" font-size="17">JigDefinition + Context</text>

      <g font-family="'SFMono-Regular', Consolas, monospace" font-size="15">
        <rect x="686" y="574" width="116" height="38" rx="9" fill="#15231d"/>
        <text x="701" y="599" fill="#9fe2c7">ctx.step()</text>
        <rect x="814" y="574" width="142" height="38" rx="9" fill="#15231d"/>
        <text x="829" y="599" fill="#9fe2c7">ctx.email()</text>
        <rect x="686" y="624" width="92" height="38" rx="9" fill="#15243a"/>
        <text x="705" y="649" fill="#a9ccff">llm()</text>
        <rect x="790" y="624" width="166" height="38" rx="9" fill="#15243a"/>
        <text x="806" y="649" fill="#a9ccff">agent(tools)</text>
      </g>
    </g>

    <g>
      <rect x="1046" y="444" width="280" height="220" rx="18" fill="#111719" stroke="#43d39e" stroke-opacity="0.58" stroke-width="2"/>
      <text x="1074" y="487" fill="#67dcb1" font-size="13" font-weight="700" letter-spacing="1.8">CONNECTIONS</text>
      <text x="1074" y="532" fill="#f2f4f7" font-size="26" font-weight="600">Typed tools</text>
      <text x="1074" y="568" fill="#aeb5bf" font-size="17">step-scoped MCP</text>
      <text x="1074" y="600" fill="#aeb5bf" font-size="17">timeouts · dry-run</text>
      <text x="1074" y="636" fill="#6f987f" font-size="14" font-family="'SFMono-Regular', Consolas, monospace">@jig/connections/*</text>
    </g>

    <g>
      <rect x="1386" y="454" width="158" height="200" rx="16" fill="#111419" stroke="#292e36" stroke-width="2"/>
      <text x="1410" y="497" fill="#7f8791" font-size="13" font-weight="700" letter-spacing="1.4">APPS + DATA</text>
      <text x="1410" y="542" fill="#f2f4f7" font-size="19" font-weight="600">Gmail</text>
      <text x="1410" y="574" fill="#f2f4f7" font-size="19" font-weight="600">Slack</text>
      <text x="1410" y="606" fill="#f2f4f7" font-size="19" font-weight="600">GitHub · …</text>
    </g>

    <g fill="none" stroke-width="2.5">
      <path d="M266 554H316" stroke="#7b828c" marker-end="url(#arrow)"/>
      <path d="M596 554H646" stroke="#43d39e" marker-end="url(#arrow-green)"/>
      <path d="M986 554H1036" stroke="#43d39e" marker-end="url(#arrow-green)"/>
      <path d="M1326 554H1376" stroke="#7b828c" marker-end="url(#arrow)"/>
      <path d="M901 330V374H461V434" stroke="#43d39e" marker-end="url(#arrow-green)"/>
      <path d="M821 679V710" stroke="#6da8ff" marker-end="url(#arrow-blue)"/>
    </g>

    <g fill="#7d858f" font-size="13" font-family="'SFMono-Regular', Consolas, monospace">
      <text x="273" y="540">run</text>
      <text x="603" y="540" fill="#72b99d">context</text>
      <text x="993" y="540" fill="#72b99d">scoped call</text>
      <text x="1334" y="540">MCP</text>
      <text x="571" y="368" fill="#72b99d">loads active version</text>
      <text x="838" y="704" fill="#7fa9df">model call</text>
    </g>

    <g>
      <rect x="656" y="720" width="330" height="44" rx="12" fill="#111722" stroke="#365b88" stroke-width="2"/>
      <text x="686" y="748" fill="#c9ddfa" font-size="17" font-weight="600">Model API</text>
      <text x="790" y="748" fill="#7898bf" font-size="14" font-family="'SFMono-Regular', Consolas, monospace">OpenRouter</text>
    </g>
  </g>
</svg>
